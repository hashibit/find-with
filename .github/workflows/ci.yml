name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf breaking --against '.git#branch=main'
        if: github.event_name == 'pull_request'

  # L0: Static analysis (~60s)
  static:
    name: 'L0 Static'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check backend/
      - run: uv run mypy backend/app/
      - run: uv run alembic -c backend/alembic.ini check
        continue-on-error: true # non-blocking until alembic.ini is fully wired

  # L1: Unit tests (~3min)
  unit:
    name: 'L1 Unit'
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest backend/tests/unit/ -x -q --timeout=60
      - run: uv run pytest backend/tests/test_health.py backend/tests/test_crypto.py -x -q

  # L2: Contract tests (~2min)
  contract:
    name: 'L2 Contract'
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest backend/tests/contract/ -x -q --timeout=120

  # L3: Integration tests (~8min) — nightly + label + release
  integration:
    name: 'L3 Integration'
    runs-on: ubuntu-latest
    needs: [unit, contract]
    if: |
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    # No GitHub services needed — testcontainers in conftest.py are self-contained.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest backend/tests/integration/ -v --timeout=120
        env:
          ENVIRONMENT: test

  extension:
    name: Extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        working-directory: extension
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Lint + Test
        working-directory: extension
        run: |
          pnpm run lint 2>/dev/null || true
          pnpm run test 2>/dev/null || true

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Lint + Build + Test
        working-directory: web
        run: |
          pnpm run lint 2>/dev/null || true
          pnpm run build 2>/dev/null || true
          pnpm run test 2>/dev/null || true
