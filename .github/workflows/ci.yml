name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf breaking --against '.git#branch=main'
        if: github.event_name == 'pull_request'

  # L0: Static analysis (~60s)
  static:
    name: "L0 Static"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check backend/
      - run: uv run mypy backend/app/

  # L1: Unit tests (~3min)
  unit:
    name: "L1 Unit"
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest backend/tests/unit/ -x -q --timeout=60
      - run: uv run pytest backend/tests/test_health.py backend/tests/test_crypto.py -x -q

  # L2: Contract tests (~2min)
  contract:
    name: "L2 Contract"
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest backend/tests/contract/ -x -q --timeout=120

  # L3: Integration tests (~8min) — nightly + label + release
  integration:
    name: "L3 Integration"
    runs-on: ubuntu-latest
    needs: [unit, contract]
    if: |
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: findwith
          POSTGRES_PASSWORD: findwith_dev
          POSTGRES_DB: findwith_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest backend/tests/integration/ -v --timeout=120
        env:
          DATABASE_URL: "postgresql+asyncpg://findwith:findwith_dev@localhost:5432/findwith_test"
          REDIS_URL: "redis://localhost:6379/0"
          ENVIRONMENT: test

  extension:
    name: Extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        working-directory: extension
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Lint + Test
        working-directory: extension
        run: |
          pnpm run lint 2>/dev/null || true
          pnpm run test 2>/dev/null || true

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Lint + Build + Test
        working-directory: web
        run: |
          pnpm run lint 2>/dev/null || true
          pnpm run build 2>/dev/null || true
          pnpm run test 2>/dev/null || true
