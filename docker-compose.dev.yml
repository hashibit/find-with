services:
  postgres:
    image: pgvector/pgvector:pg15
    ports:
      - '14600:5432'
    environment:
      POSTGRES_USER: findwith
      POSTGRES_PASSWORD: findwith_dev
      POSTGRES_DB: findwith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U findwith']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '14601:6379'
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - '14602:9000'
      - '14603:9001'
    environment:
      MINIO_ROOT_USER: findwith
      MINIO_ROOT_PASSWORD: findwith_dev
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 findwith findwith_dev &&
        mc mb --ignore-existing local/findwith-dev
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '14604:1025'
      - '14605:8025'

  mock-stripe:
    build:
      context: ./mocks/stripe
    ports:
      - '14802:14802'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:14802/health']
      interval: 5s
      timeout: 3s
      retries: 5

  mock-clerk:
    build:
      context: ./mocks/clerk
    ports:
      - '14803:14803'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:14803/health']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
