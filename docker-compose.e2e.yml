name: findwith-e2e

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: findwith_e2e
      PGPORT: "14800"
    ports:
      - "14800:14800"
    volumes:
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 14800 -U e2e -d findwith_e2e"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "14801:14801"
    command: redis-server --port 14801 --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "14801", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --address ":14802" --console-address ":14803"
    environment:
      MINIO_ROOT_USER: e2ekey
      MINIO_ROOT_PASSWORD: e2esecret
    ports:
      - "14802:14802"
      - "14803:14803"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14802/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:14802 e2ekey e2esecret &&
        mc mb --ignore-existing local/findwith-test
      "

  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_BIND_ADDR: '0.0.0.0:14804'
      MP_UI_BIND_ADDR: '0.0.0.0:14805'
    ports:
      - "14804:14804"
      - "14805:14805"

  mock-dom:
    build:
      context: ./mocks/dom
    volumes:
      - ./e2e/fixtures/dom:/app/fixtures:ro
    environment:
      PORT: "14808"
    ports:
      - "14808:14808"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14808/health"]
      interval: 3s
      timeout: 3s
      retries: 5

  mock-llm:
    build:
      context: ./mocks/llm
    environment:
      LLM_RECORD: "${LLM_RECORD:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PORT: "14809"
    ports:
      - "14809:14809"
    volumes:
      - ./e2e/fixtures/llm:/app/fixtures
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14809/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  mock-stripe:
    build:
      context: ./mocks/stripe
    environment:
      PORT: "14810"
    ports:
      - "14810:14810"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14810/health"]
      interval: 3s
      timeout: 3s
      retries: 5

  mock-clerk:
    build:
      context: ./mocks/clerk
    environment:
      PORT: "14811"
    ports:
      - "14811:14811"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14811/health"]
      interval: 3s
      timeout: 3s
      retries: 5
