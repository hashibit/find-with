services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: findwith_e2e
    ports:
      - "14600:5432"
    volumes:
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d findwith_e2e"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "14601:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: e2ekey
      MINIO_ROOT_PASSWORD: e2esecret
    ports:
      - "14602:9000"
      - "14603:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 e2ekey e2esecret &&
        mc mb --ignore-existing local/findwith-test
      "

  mailpit:
    image: axllent/mailpit
    ports:
      - "14604:1025"
      - "14605:8025"

  mock-dom:
    build:
      context: ./e2e/mock-dom
    volumes:
      - ./e2e/fixtures/dom:/app/fixtures:ro
    ports:
      - "14800:14800"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14800/health"]
      interval: 3s
      timeout: 3s
      retries: 5

  mock-llm:
    build:
      context: ./e2e/mock-llm
    environment:
      LLM_RECORD: "${LLM_RECORD:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PORT: "11435"
    ports:
      - "14801:11435"
    volumes:
      - ./e2e/fixtures/llm:/app/fixtures
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11435/health"]
      interval: 3s
      timeout: 3s
      retries: 10
