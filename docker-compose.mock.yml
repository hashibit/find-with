name: findwith-mock

# Standalone mock services for external dependencies.
# Can be started independently for local dev exploration, or composed into
# docker-compose.dev.yml / docker-compose.e2e.yml as needed.
#
# Uses DEV port range (146xx):
#   mock-dom    :14608 — static HTML fixture server (LinkedIn / Gmail pages)
#   mock-llm    :14609 — OpenAI-compatible LLM mock (fixtures + recording mode)
#   mock-stripe :14610 — Stripe API mock (checkout, portal, subscriptions)
#   mock-clerk  :14611 — Clerk JWKS + JWT signing mock
services:
  mock-dom:
    build:
      context: ./mocks/dom
    environment:
      PORT: "14608"
    ports:
      - "14608:14608"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14608/health"]
      interval: 3s
      timeout: 3s
      retries: 5

  mock-llm:
    build:
      context: ./mocks/llm
    environment:
      LLM_RECORD: "${LLM_RECORD:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PORT: "14609"
    ports:
      - "14609:14609"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14609/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  mock-stripe:
    build:
      context: ./mocks/stripe
    environment:
      PORT: "14610"
    ports:
      - "14610:14610"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14610/health"]
      interval: 3s
      timeout: 3s
      retries: 5

  mock-clerk:
    build:
      context: ./mocks/clerk
    environment:
      PORT: "14611"
    ports:
      - "14611:14611"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14611/health"]
      interval: 3s
      timeout: 3s
      retries: 5
