<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>FindWith / Quinn — UI Design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        margin: 0;
        background: #0e0e10;
        color: #fff;
      }
      .canvas-intro {
        padding: 20px 24px;
        font-family: 'Inter', sans-serif;
        color: #c7c7cc;
        max-width: 720px;
        line-height: 1.6;
      }
      .canvas-intro h1 {
        font-family: 'Source Serif 4', serif;
        font-weight: 500;
        font-size: 28px;
        color: #fff;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      .canvas-intro h1 .ital {
        font-style: italic;
        color: #ffb17a;
      }
      .canvas-intro p {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .canvas-intro .meta {
        font-size: 12px;
        color: #8a8a8e;
        margin-top: 12px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="components/shared.jsx"></script>
    <script type="text/babel" src="screens/onboarding.jsx"></script>
    <script type="text/babel" src="screens/job-analysis.jsx"></script>
    <script type="text/babel" src="screens/radar.jsx"></script>
    <script type="text/babel" src="screens/library.jsx"></script>
    <script type="text/babel" src="screens/archive.jsx"></script>
    <script type="text/babel" src="screens/easy-apply.jsx"></script>
    <script type="text/babel" src="screens/resume-tailoring.jsx"></script>

    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" data-presets="env,react">
      const { DesignCanvas, DCSection, DCArtboard } = window;
      const { TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakColor } = window;

      const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/ {
        qStyle: 'circle',
        aColor: '#1E40AF',
        bColor: '#1E40AF',
      }; /*EDITMODE-END*/

      function App() {
        const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
        const tweaks = t;

        return (
          <>
            <DesignCanvas
              title={
                <span>
                  <span
                    style={{
                      fontFamily: 'Source Serif 4, serif',
                      fontStyle: 'italic',
                      fontWeight: 500,
                    }}
                  >
                    FindWith
                  </span>{' '}
                  &nbsp;·&nbsp; Quinn UI / UX
                </span>
              }
              subtitle="Chrome 浏览器扩展 · v0.1 · 两个视觉方向 × 六屏关键场景"
              background="#0E0E10"
            >
              <DCSection id="overview" title="概览">
                <div
                  style={{
                    padding: '28px 32px',
                    maxWidth: 720,
                    background: '#17171A',
                    border: '1px solid #2A2A2E',
                    borderRadius: 12,
                    color: '#C7C7CC',
                    fontFamily: 'Inter, sans-serif',
                    lineHeight: 1.65,
                  }}
                >
                  <div
                    style={{
                      fontFamily: 'Source Serif 4, serif',
                      fontSize: 24,
                      fontWeight: 500,
                      color: '#fff',
                      letterSpacing: '-0.02em',
                      marginBottom: 8,
                    }}
                  >
                    <span style={{ fontStyle: 'italic', color: '#FFB17A' }}>Quinn</span> ·
                    一个有终点的 AI 求职伙伴
                  </div>
                  <p style={{ margin: '0 0 14px', fontSize: 13.5 }}>
                    基于 PRD v0.1，我设计了 6 个关键场景的高保真稿，每个场景都给了两个视觉方向：
                  </p>
                  <div
                    style={{
                      display: 'grid',
                      gridTemplateColumns: '1fr 1fr',
                      gap: 14,
                      fontSize: 12.5,
                      marginBottom: 16,
                    }}
                  >
                    <div style={{ padding: 14, border: '1px solid #2A2A2E', borderRadius: 8 }}>
                      <div style={{ fontWeight: 600, color: '#fff', marginBottom: 4 }}>
                        方向 A · Editor
                      </div>
                      <div style={{ color: '#8A8A8E' }}>
                        纯 Inter · 黑白灰 + 深蓝 · 偏 Linear/Vercel
                        那种克制利落感，所有信息密度高、关系清晰。
                      </div>
                    </div>
                    <div style={{ padding: 14, border: '1px solid #2A2A2E', borderRadius: 8 }}>
                      <div style={{ fontWeight: 600, color: '#fff', marginBottom: 4 }}>
                        方向 B · Letterpress
                      </div>
                      <div style={{ color: '#8A8A8E' }}>
                        Inter + Source Serif 4 衬线点缀 · 暖米底 + 赭石强调 · 仍是编辑感，但加了一点
                        Quinn 的"前辈"温度。
                      </div>
                    </div>
                  </div>
                  <div style={{ fontSize: 12, color: '#8A8A8E' }}>
                    <strong style={{ color: '#fff' }}>右上角的 Tweaks</strong> 可以切换 Quinn
                    的图标样式（圆/几何/方块）和两个方向各自的强调色（深蓝/深绿/赭石/橄榄）——所有屏会同步更新。
                  </div>
                </div>
              </DCSection>

              <DCSection id="onboarding" title="① 第一次使用 / Onboarding">
                <DCArtboard id="ob-a" label="Editor" width={420} height={760}>
                  <OnboardingA tweaks={tweaks} />
                </DCArtboard>
              </DCSection>

              <DCSection id="analysis" title="② 灵魂瞬间 — LinkedIn 岗位三层匹配分析（卡片点击态）">
                <DCArtboard id="ja-default" label="默认" width={420} height={760}>
                  <JobAnalysisA tweaks={tweaks} />
                </DCArtboard>
                <DCArtboard
                  id="ja-company"
                  label="点击 · 公司速读 → 抽屉展开"
                  width={420}
                  height={760}
                >
                  <JobAnalysisA_Company tweaks={tweaks} />
                </DCArtboard>
                <DCArtboard id="ja-jd" label="点击 · JD 某条 → 对应素材" width={420} height={760}>
                  <JobAnalysisA_JD tweaks={tweaks} />
                </DCArtboard>
                <DCArtboard id="ja-gap" label="点击 · 缺口 → 启动挖掘对话" width={420} height={760}>
                  <JobAnalysisA_Gap tweaks={tweaks} />
                </DCArtboard>
              </DCSection>

              <DCSection id="tailoring" title="③ 教练式简历定制 — 双栏对比 + 溯源 + 缺口挖掘">
                <DCArtboard id="rt-a" label="全屏工作区" width={1280} height={820}>
                  <ResumeTailoringA tweaks={tweaks} />
                </DCArtboard>
              </DCSection>

              <DCSection id="radar" title="④ 求职雷达（默认 + 状态详情）">
                <DCArtboard id="rd-default" label="默认列表" width={420} height={760}>
                  <RadarA tweaks={tweaks} />
                </DCArtboard>
                <DCArtboard
                  id="rd-submitted"
                  label="点击 · 已投递（Linear）"
                  width={420}
                  height={760}
                >
                  <RadarA_Submitted tweaks={tweaks} />
                </DCArtboard>
                <DCArtboard
                  id="rd-interview"
                  label="点击 · 进入面试（Notion）"
                  width={420}
                  height={760}
                >
                  <RadarA_Interview tweaks={tweaks} />
                </DCArtboard>
              </DCSection>

              <DCSection id="library" title="⑤ 档案 & 素材库 — 全屏数据库视图">
                <DCArtboard id="ar-a" label="全屏工作区" width={1280} height={800}>
                  <ArchiveA tweaks={tweaks} />
                </DCArtboard>
              </DCSection>

              <DCSection id="easyapply" title="⑥ 投递陪伴 — Easy Apply 自动填表确认">
                <DCArtboard id="ea-a" label="Editor" width={420} height={760}>
                  <EasyApplyA tweaks={tweaks} />
                </DCArtboard>
              </DCSection>
            </DesignCanvas>

            <TweaksPanel title="Tweaks">
              <TweakSection title="Quinn 图标">
                <TweakRadio
                  label="样式"
                  value={tweaks.qStyle}
                  onChange={(v) => setTweak('qStyle', v)}
                  options={[
                    { value: 'circle', label: '圆 + Q' },
                    { value: 'glyph', label: '几何符号' },
                    { value: 'block', label: '方块' },
                  ]}
                />
              </TweakSection>
              <TweakSection title="A · Editor 强调色">
                <TweakColor
                  label="A 强调色"
                  value={tweaks.aColor}
                  onChange={(v) => setTweak('aColor', v)}
                  options={['#1E40AF', '#0F4C3A', '#7A4220', '#0B0B0F']}
                />
              </TweakSection>
              <TweakSection title="B · Letterpress 强调色">
                <TweakColor
                  label="B 强调色"
                  value={tweaks.bColor}
                  onChange={(v) => setTweak('bColor', v)}
                  options={['#8A4B14', '#1E40AF', '#2F5D3A', '#5B5446']}
                />
              </TweakSection>
            </TweaksPanel>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
