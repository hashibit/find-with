// Quinn 可调用的工具（内部 IR；运行时与 LLM provider 协议互转）
syntax = "proto3";
package findwith.agent.v1;

message ToolSpec {
  string name = 1;          // search_company, parse_jd, ...
  string description = 2;
  string params_schema_json = 3;       // JSON Schema
  ExecutionMode execution_mode = 4;    // SYNC: 直接执行；ASYNC: 入队 + 状态推送
  repeated string requires = 5;        // 前置条件断言，如 "material.status in {CONFIRMED,USER_EDITED}"
  SideEffectKind side_effect = 6;      // READ / WRITE
}
enum ExecutionMode {
  EXEC_UNSPECIFIED = 0;
  EXEC_SYNC = 1;       // 期望 < 2s；阻塞 SSE turn 完成
  EXEC_ASYNC = 2;      // 长任务（generate_tailored_resume 等）；返回 task_id 推 StateChange
}
enum SideEffectKind { SIDE_UNSPECIFIED=0; SIDE_READ=1; SIDE_WRITE=2; }

// 工具调用统一接口
service ToolGateway {
  rpc Invoke (InvokeRequest) returns (InvokeResponse);
}
message InvokeRequest {
  string tool_name = 1;
  string arguments_json = 2;
  string user_id = 3;
  string conversation_id = 4;
}
message InvokeResponse {
  string result_json = 1;
  bool ok = 2;
  string error = 3;
  string task_id = 4;          // ASYNC 时返回；前端用此 id 关联 StateChange 事件
  ExecutionMode actual_mode = 5;
}
