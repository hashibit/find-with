// material.proto — 素材库（产品的灵魂数据）
syntax = "proto3";
package findwith.profile.v1;

import "findwith/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

message MaterialItem {
  findwith.common.v1.Id id = 1;
  findwith.common.v1.Id user_id = 2;

  string raw_text = 3;             // 用户原话
  string shining_text = 4;         // Quinn 重写的"闪光版本"
  string rationale = 5;            // 为什么算闪光点（Quinn 的判断依据）

  repeated string tags = 6;        // [leadership, ownership, ...] 受控词表
  Quantification quant = 7;        // 量化数据（可空）

  Provenance source = 8;           // 来源溯源（产品核心信任机制）
  ConfirmStatus status = 9;        // 用户确认状态

  findwith.common.v1.Id linked_experience_id = 10; // 关联 work/project
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message Quantification {
  string metric = 1;       // "team size" | "efficiency" | "revenue"
  string value = 2;        // "30 people" | "+25%" | "$2M ARR"
  bool user_confirmed = 3;
}

// 溯源：每条素材必须能追到一条对话或一段简历原文
message Provenance {
  oneof source {
    ConversationSource conversation = 1;
    ResumeProvenance resume = 2;
    ManualSource manual = 3;
  }
}
message ConversationSource {
  findwith.common.v1.Id conversation_id = 1;
  findwith.common.v1.Id message_id = 2;
  google.protobuf.Timestamp captured_at = 3;
}
// 注意：此处不能复用顶层 ResumeSource（profile.proto 已占用此名）。
// protoc 在同一 package 下不允许同名 message。改名 ResumeProvenance。
message ResumeProvenance {
  findwith.common.v1.Id resume_id = 1;
  string char_range = 2;     // "L42-L58"
}
message ManualSource { string note = 1; }

enum ConfirmStatus {
  CONFIRM_UNSPECIFIED = 0;
  CONFIRM_PROPOSED   = 1;   // Quinn 提出，未让用户看
  CONFIRM_PRESENTED  = 2;   // 已展示
  CONFIRM_CONFIRMED  = 3;   // 用户确认
  CONFIRM_REJECTED   = 4;
}
