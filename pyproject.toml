[project]
name = "findwith"
version = "0.1.0"
description = "FindWith - AI-powered job search companion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "boto3>=1.34.0",
    "sentry-sdk[fastapi]>=2.5.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1.0",
    "weasyprint>=62.0",
    "tiktoken>=0.7.0",
    "pgvector>=0.3.0",
    "python-ulid>=2.7.0",
    "dompurify>=0.1.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "jinja2>=3.1.0",
    "mjml>=0.1.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "testcontainers[postgres,redis,minio]>=4.4.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "ERA", "PGH", "PL", "TRY", "FLY", "PERF", "RUF"]
ignore = ["S101", "TRY003", "COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
